<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f2fb" />
<title>测评入口 · 授权码验证</title>
<style>
  :root {
    --ink: #302945;
    --muted: #80758c;
    --purple: #7861bb;
    --purple-deep: #5b4595;
    --pink: #d675a6;
    --line: #e9e0ef;
    --paper: #fff;
    --bg: #f7f2fb;
    --ok: #1d9e75;
    --err: #d8554a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 28px 18px;
  }
  .card {
    width: 100%; max-width: 430px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 20px; padding: 30px 24px 24px;
    box-shadow: 0 10px 40px rgba(120, 97, 187, .10);
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 20px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), var(--pink)); }
  .brand span { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--purple-deep); }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 7px; letter-spacing: .03em; }
  .field { position: relative; }
  input[type=text] {
    width: 100%; padding: 14px 15px; font-size: 17px; letter-spacing: .10em;
    font-family: "SF Mono", Menlo, Consolas, monospace; text-transform: uppercase;
    border: 1.5px solid var(--line); border-radius: 12px; background: #fbf9fe; color: var(--ink);
    outline: none; transition: border-color .15s, background .15s;
  }
  input[type=text]:focus { border-color: var(--purple); background: #fff; }
  input[type=text]::placeholder { color: #c3bcd4; letter-spacing: .06em; }
  .btn {
    width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px;
    background: var(--purple); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .1s, background .15s;
  }
  .btn:active { transform: scale(.985); background: var(--purple-deep); }
  .btn[disabled] { background: #cfc7e0; cursor: default; }
  .btn.ghost { background: #f2edf9; color: var(--purple-deep); }
  .msg {
    margin-top: 14px; padding: 11px 13px; border-radius: 10px; font-size: 13px; line-height: 1.6;
    display: none;
  }
  .msg.show { display: block; }
  .msg.err { background: #fdf0ee; color: #a5342a; border: 1px solid #f6d5d1; }
  .msg.ok { background: #eaf7f1; color: #12684d; border: 1px solid #c5e8d8; }
  .hint { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .hint code { font-family: "SF Mono", Menlo, monospace; background: #f2edf9; padding: 1px 5px; border-radius: 5px; font-size: 11.5px; }

  .tests { margin-top: 20px; display: none; }
  .tests.show { display: block; }
  .tests h2 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 10px; letter-spacing: .03em; }
  .test {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 13px 14px; margin-bottom: 9px; background: #fbf9fe; border: 1px solid var(--line);
    border-radius: 13px; cursor: pointer; transition: border-color .15s, background .15s;
    font: inherit; color: inherit;
  }
  /* 只在支持悬停的设备（鼠标）上给 hover 底色，手机上不生效 */
  @media (hover: hover) {
    .test:hover { border-color: var(--purple); background: #fff; }
  }
  .test:active { transform: scale(.99); }
  .test .ic {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    background: linear-gradient(135deg, #ece5fa, #fbe6f0);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .test .tx { flex: 1; min-width: 0; }
  .test .nm { font-size: 14.5px; font-weight: 600; }
  .test .ds { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .test .pr { font-size: 13px; font-weight: 600; color: var(--pink); white-space: nowrap; }
  .step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .step b { color: var(--purple-deep); font-weight: 600; }
  .spinner {
    width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; display: inline-block;
    vertical-align: -3px; margin-right: 7px; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ok-ico { width: 46px; height: 46px; border-radius: 50%; background: #eaf7f1; color: var(--ok);
    display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 12px; }
  .footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: #a49bb5; line-height: 1.7; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main class="card">

  <div class="brand"><span class="dot"></span><span>测评入口</span></div>

  <!-- 第一步：输入授权码 -->
  <section id="step1">
    <h1>输入授权码</h1>
    <p class="sub">下单后会自动发货一串授权码，粘贴到这里即可进入。</p>

    <label for="code">授权码</label>
    <div class="field">
      <input id="code" type="text" placeholder="XX-XXXX-XXXX" autocomplete="off"
             spellcheck="false" inputmode="text" enterkeyhint="done" />
    </div>

    <div id="msg" class="msg"></div>

    <button id="next" class="btn" disabled>下一步</button>

    <div class="hint">
      授权码区分大小写无影响，可直接带短横粘贴。<br>
      一个授权码默认<code>仅可使用一次</code>，请勿转发给他人。
    </div>
  </section>

  <!-- 第二步：选择测试 -->
  <section id="step2" class="hidden">
    <div class="step">授权码 <b id="codeEcho"></b> 已验证可用</div>
    <h1>选择要进入的测试</h1>
    <p class="sub">这个授权码可以进入下面的测试。</p>
    <div id="testList" class="tests show"></div>
    <button id="back" class="btn ghost">换个授权码</button>
  </section>

  <!-- 第三步：通过 -->
  <section id="step3" class="hidden" style="text-align:center">
    <div class="ok-ico">&#10003;</div>
    <h1 id="okTitle">验证通过</h1>
    <p class="sub" id="okSub">正在进入测试…</p>
    <div class="hint" id="okNote"></div>
  </section>

  <div class="footer">
    本测评为趣味自我探索工具，非专业心理评估，不构成任何诊断或建议。<br>
    虚拟商品，发货后不支持退换。
  </div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var input = $('code'), msg = $('msg'), nextBtn = $('next');
  var currentCode = '';
  var tests = [];

  var params = new URLSearchParams(location.search);
  var presetCode = (params.get('code') || '').toUpperCase().replace(/\s/g, '');
  var presetTest = params.get('test') || '';
  // 通用码的兑换链接带的是 test=*，含义是"由用户自己挑测试"。
  // 归一成空串，走「下一步 → 选测试」流程；否则拿 '*' 去校验会报「测试不存在」。
  if (presetTest === '*') presetTest = '';
  var presetErr = params.get('err') || '';

  // ---- 错误文案表 ----
  var ERRORS = {
    not_found: '授权码不存在，请检查是否输入有误。',
    revoked: '该授权码已被作废，如有疑问请联系客服。',
    exhausted: '该授权码已被使用过，无法重复进入。每个授权码仅限一次，请勿转发。',
    wrong_test: '该授权码不适用于这个测试。',
    offline: '该测试暂未上架。',
    empty: '请输入授权码。',
    no_test: '缺少测试标识，请从商品页链接进入。'
  };
  function showErr(text, kind) {
    msg.textContent = text;
    msg.className = 'msg show ' + (kind || 'err');
  }
  function clearErr() { msg.className = 'msg'; msg.textContent = ''; }

  // ---- 输入规范化 ----
  // 只做大写 + 去空白。不做 O→0 / L→1 替换：随机段字符集已剔除易混字符，
  // 而前缀是自定义的（默认 "LA" 含 L），替换会让正确输入也匹配不上。
  function normalize(v) {
    return String(v || '').toUpperCase().replace(/[\s\u3000]/g, '').replace(/[^A-Z0-9-]/g, '');
  }
  input.addEventListener('input', function () {
    var p = input.selectionStart;
    input.value = normalize(input.value);
    try { input.setSelectionRange(p, p); } catch (e) {}
    clearErr();
    var v = input.value.trim();
    nextBtn.disabled = v.replace(/-/g, '').length < 6;
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !nextBtn.disabled) nextBtn.click();
  });

  // ---- 加载可用测试 ----
  function loadTests() {
    return fetch('/api/config').then(function (r) { return r.json(); })
      .then(function (d) { tests = (d && d.tests) || []; return tests; })
      .catch(function () { return []; });
  }

  function renderTests(list) {
    var box = $('testList');
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = '<div class="hint">暂无可进入的测试。</div>';
      return;
    }
    list.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'test';
      b.innerHTML =
        '<span class="ic">&#9825;</span>' +
        '<span class="tx"><span class="nm"></span><span class="ds"></span></span>' +
        '<span class="pr">' + (t.price ? '&yen;' + t.price : '') + '</span>';
      b.querySelector('.nm').textContent = t.name;
      b.querySelector('.ds').textContent = t.subtitle || '';
      b.addEventListener('click', function () { verify(currentCode, t.id); });
      box.appendChild(b);
    });
  }

  function goto(step) {
    ['step1', 'step2', 'step3'].forEach(function (s) { $(s).classList.add('hidden'); });
    $(step).classList.remove('hidden');
  }

  // ---- 进入测评页 ----
  // 用 location.replace 而不是 href：把授权页本身从浏览历史里替换掉，
  // 买家按返回键就不会再回到授权页、也就不会卡在「已被使用」。
  var lastRedirect = '';
  function enter(url, delay) {
    lastRedirect = url;
    setTimeout(function () { location.replace(url); }, delay || 0);
  }
  // 浏览器按返回时页面可能从 bfcache 直接恢复（脚本不会重跑），这里补跳一次
  window.addEventListener('pageshow', function (e) {
    if (e.persisted && lastRedirect) location.replace(lastRedirect);
  });

  // ---- 校验 ----
  function verify(code, testId) {
    nextBtn.innerHTML = '<span class="spinner"></span>验证中';
    nextBtn.disabled = true;
    fetch('/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, test: testId })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          // d.reentry = 同一个浏览器重复进入（返回上一页 / 重开链接），服务端不再扣次数
          $('okTitle').textContent = d.reentry ? '欢迎回来' : '验证通过';
          $('okSub').textContent = (d.reentry ? '正在回到「' : '正在进入「') + d.testName + '」…';
          $('okNote').textContent = d.note ? ('授权备注：' + d.note) : '';
          goto('step3');
          enter(d.redirect, d.reentry ? 250 : 550);
          return;
        }
        var text = (d && d.message) || ERRORS[d && d.reason] || '验证失败，请稍后重试。';
        showErr(text);
        nextBtn.innerHTML = '下一步';
        nextBtn.disabled = false;
        if (d && d.reason === 'wrong_test' && d.testId) {
          loadTests().then(function () { renderTests(tests); });
        }
      })
      .catch(function () {
        showErr('网络异常，请稍后重试。');
        nextBtn.innerHTML = '下一步';
        nextBtn.disabled = false;
      });
  }

  // ---- 下一步 ----
  nextBtn.addEventListener('click', function () {
    currentCode = normalize(input.value);
    if (currentCode.replace(/-/g, '').length < 6) { showErr('授权码看起来不完整。'); return; }
    clearErr();
    if (presetTest) { verify(currentCode, presetTest); return; }
    loadTests().then(function (list) {
      $('codeEcho').textContent = currentCode;
      renderTests(list);
      goto('step2');
    });
  });

  $('back').addEventListener('click', function () {
    goto('step1');
    nextBtn.innerHTML = '下一步';
    nextBtn.disabled = false;
    input.focus();
  });

  // ---- 预填 / 错误直达 ----
  if (presetCode) {
    input.value = presetCode;
    input.dispatchEvent(new Event('input'));
    if (presetErr) { showErr(ERRORS[presetErr] || '验证未通过。'); }
    else if (presetTest) { setTimeout(function () { nextBtn.click(); }, 120); }
    else { setTimeout(function () { nextBtn.click(); }, 120); }
  } else if (presetErr) {
    showErr(ERRORS[presetErr] || '验证未通过。');
  } else if (params.get('need')) {
    showErr('这个测试需要授权码才能进入。');
  }
  if (!presetCode) input.focus();
})();
</script>
</body>
</html>
