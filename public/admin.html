<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>授权码管理后台</title>
    <style>
      :root {
        --ink: #2b2b33;
        --muted: #7c7c88;
        --line: #e6e4ec;
        --paper: #fff;
        --bg: #f6f5f9;
        --purple: #6f5bb8;
        --purple-deep: #553f96;
        --ok: #1d9e75;
        --warn: #b8791a;
        --err: #c9483d;
        --mono: "SF Mono", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.65 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 26px 20px 60px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        margin: 0;
      }
      header .tag {
        font-size: 12px;
        color: var(--muted);
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 16px;
      }
      .card h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 14px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .f {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .f label {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      input,
      select {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fbfbfd;
        color: var(--ink);
        outline: none;
        min-width: 0;
      }
      input:focus,
      select:focus {
        border-color: var(--purple);
        background: #fff;
      }
      input.mono {
        font-family: var(--mono);
        letter-spacing: 0.06em;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 9px 15px;
        border: 0;
        border-radius: 9px;
        background: var(--purple);
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: var(--purple-deep);
      }
      button.ghost {
        background: #efeaf8;
        color: var(--purple-deep);
      }
      button.mini {
        padding: 4px 9px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 7px;
      }
      button.mini.danger {
        background: #fbeceb;
        color: var(--err);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .stat {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px 15px;
      }
      .stat b {
        display: block;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.2;
      }
      .stat span {
        font-size: 11.5px;
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      td {
        padding: 9px 10px;
        border-bottom: 1px solid #f0eef4;
        vertical-align: middle;
      }
      tr:hover td {
        background: #faf9fc;
      }
      .code {
        font-family: var(--mono);
        font-size: 12.5px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .b-unused {
        background: #eaf7f1;
        color: #12684d;
      }
      .b-active {
        background: #fdf3e3;
        color: #8a5a10;
      }
      .b-exhausted {
        background: #eef0f4;
        color: #5c5c68;
      }
      .b-revoked {
        background: #fbeceb;
        color: #a5342a;
      }
      .out {
        font-family: var(--mono);
        font-size: 12.5px;
        background: #f6f4fb;
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 12px;
        margin-top: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 190px;
        overflow: auto;
      }
      .note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.7;
      }
      .hidden {
        display: none !important;
      }
      .empty {
        padding: 26px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .group {
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 14px;
        overflow: hidden;
      }
      .group h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        padding: 11px 14px;
        background: #fbf9ff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .group h3 .gname {
        color: var(--purple-deep);
      }
      .group h3 .gsum {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 500;
      }
      .group h3 .gsp {
        flex: 1;
      }
      .group table {
        margin: 0;
      }
      .group td.tm {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .bar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .bar .sp {
        flex: 1;
      }
      header .sp {
        flex: 1;
      }
      .login {
        max-width: 420px;
        margin: 9vh auto 18px;
      }
      .login h2 {
        color: var(--purple-deep);
      }
      #pwd {
        font-family: var(--mono);
        letter-spacing: 0.08em;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        background: #2b2b33;
        color: #fff;
        font-size: 13px;
        padding: 9px 16px;
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 99;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>授权码管理后台</h1>
        <span class="tag">生成 / 查看 / 作废 · 密码登录</span>
        <span class="sp"></span>
        <button id="logout" class="ghost mini hidden">退出登录</button>
      </header>

      <!-- 登录 -->
      <div id="login" class="card login hidden">
        <h2>管理员登录</h2>
        <div class="row">
          <div class="f" style="flex: 1; min-width: 190px">
            <label for="pwd">管理密码</label>
            <input
              id="pwd"
              type="password"
              placeholder="请输入管理密码"
              autocomplete="current-password"
            />
          </div>
          <button id="doLogin">进入</button>
        </div>
        <div class="note" id="loginNote">
          仅限管理员访问，登录后 7 天内免重复输入。
        </div>
      </div>

      <div id="panel" class="hidden">
        <div class="stats" id="stats"></div>

        <!-- 生成 -->
        <div class="card">
          <h2>批量生成授权码</h2>
          <div class="row">
            <div class="f">
              <label for="gPrefix">前缀</label>
              <input
                id="gPrefix"
                type="text"
                value="LA"
                maxlength="8"
                style="width: 88px"
              />
            </div>
            <div class="f">
              <label for="gCount">数量</label>
              <input
                id="gCount"
                type="number"
                value="20"
                min="1"
                max="500"
                style="width: 88px"
              />
            </div>
            <div class="f">
              <label for="gTest">适用测试</label>
              <select id="gTest" style="min-width: 180px"></select>
            </div>
            <div class="f">
              <label for="gUses">可用次数</label>
              <select id="gUses" style="width: 120px">
                <option value="1" selected>1 次（一次性）</option>
                <option value="0">不限（演示用）</option>
                <option value="3">3 次</option>
              </select>
            </div>
            <div class="f" style="flex: 1; min-width: 160px">
              <label for="gNote">备注（水印显示，如买家昵称/订单号）</label>
              <input
                id="gNote"
                type="text"
                placeholder="选填，最多 60 字"
                maxlength="60"
              />
            </div>
            <button id="gen">生成</button>
          </div>
          <div id="genOut" class="out hidden"></div>
          <div class="bar" style="margin-top: 12px; margin-bottom: 0">
            <button id="copyAll" class="ghost hidden">复制全部未使用</button>
            <span class="note" style="margin: 0"
              >一次性码是默认选项：第一个打开的人用掉，转发第二个人会提示「已被使用」。</span
            >
          </div>
        </div>

        <!-- 列表 -->
        <div class="card">
          <h2>授权码列表（按品类分组）</h2>
          <div class="bar">
            <div class="f">
              <label for="fTest">只看品类</label>
              <select id="fTest" style="min-width: 180px"></select>
            </div>
            <span class="sp"></span>
            <button id="refresh" class="ghost mini">刷新</button>
          </div>
          <div id="groups"></div>
          <div id="empty" class="">还没有授权码，先在上面生成一批。</div>
        </div>
      </div>
    </div>
    <div id="toast"></div>

    <script>
      (function () {
        "use strict";
        var $ = function (id) {
          return document.getElementById(id);
        };
        var tests = [];
        var rows = [];

        function toast(t) {
          var el = $("toast");
          el.textContent = t;
          el.classList.add("show");
          clearTimeout(el._t);
          el._t = setTimeout(function () {
            el.classList.remove("show");
          }, 1600);
        }
        function copy(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              toast("已复制");
            });
          } else {
            var ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              toast("已复制");
            } catch (e) {
              toast("复制失败");
            }
            document.body.removeChild(ta);
          }
        }
        function api(url, opts) {
          opts = opts || {};
          return fetch(url, opts).then(function (r) {
            return r.json().then(function (d) {
              if (r.status === 401) {
                var e = new Error(d.message || "登录已失效");
                e.needLogin = true;
                throw e;
              }
              if (!d.ok && d.message) throw new Error(d.message);
              return d;
            });
          });
        }

        function onErr(e) {
          if (e && e.needLogin) {
            showLogin("登录已失效，请重新输入密码");
            return;
          }
          toast((e && e.message) || "操作失败");
        }

        function showLogin(msg) {
          $("panel").classList.add("hidden");
          $("logout").classList.add("hidden");
          $("login").classList.remove("hidden");
          $("loginNote").textContent =
            msg || "仅限管理员访问，登录后 7 天内免重复输入。";
          $("pwd").focus();
        }

        // 登录成功：进入后台并加载数据
        function afterAuth() {
          $("login").classList.add("hidden");
          $("logout").classList.remove("hidden");
          $("panel").classList.remove("hidden");
          loadTestList();
          refresh();
        }

        // 初始化：已有有效会话直接进后台，否则显示登录框
        function boot() {
          api("/api/admin/list")
            .then(function (d) {
              if (d && d.ok) afterAuth();
            })
            .catch(function () {
              showLogin();
            });
        }

        function doLogin() {
          var pwd = $("pwd").value;
          if (!pwd) return toast("请输入密码");
          api("/api/admin/login", {
            method: "POST",
            body: JSON.stringify({ password: pwd }),
          })
            .then(function () {
              $("pwd").value = "";
              toast("登录成功");
              afterAuth();
            })
            .catch(function (e) {
              var msg = (e && e.message) || "密码不正确";
              $("loginNote").textContent = msg;
              toast(msg);
            });
        }

        function fillTestSelects() {
          var opts = '<option value="*">通用（任选测试）</option>';
          tests.forEach(function (t) {
            opts +=
              '<option value="' +
              t.id +
              '">' +
              t.name +
              (t.status === "online" ? "" : "（未上架）") +
              "</option>";
          });
          $("gTest").innerHTML = opts;
          $("fTest").innerHTML = '<option value="">全部测试</option>' + opts;
        }

        function statusBadge(s) {
          var map = {
            unused: ["b-unused", "未使用"],
            active: ["b-active", "使用中"],
            exhausted: ["b-exhausted", "已核销"],
            revoked: ["b-revoked", "已作废"],
            missing: ["b-revoked", "不存在"],
          };
          var m = map[s] || ["b-exhausted", s];
          return '<span class="badge ' + m[0] + '">' + m[1] + "</span>";
        }

        function renderStats(st) {
          $("stats").innerHTML =
            stat(st.total, "总码数") +
            stat(st.unused, "未使用") +
            stat(st.active, "使用中") +
            stat(st.exhausted, "已核销") +
            stat(st.revoked, "已作废");
          function stat(n, label) {
            return (
              '<div class="stat"><b>' +
              n +
              "</b><span>" +
              label +
              "</span></div>"
            );
          }
        }

        function fmtTime(ts) {
          if (!ts) return "—";
          var d = new Date(ts);
          if (isNaN(d.getTime())) return String(ts).slice(0, 10);
          function p(n) {
            return (n < 10 ? "0" : "") + n;
          }
          return (
            d.getFullYear() +
            "-" +
            p(d.getMonth() + 1) +
            "-" +
            p(d.getDate()) +
            " " +
            p(d.getHours()) +
            ":" +
            p(d.getMinutes())
          );
        }

        // 单行
        function rowEl(r) {
          var tr = document.createElement("tr");
          tr.innerHTML =
            '<td class="code">' +
            r.code +
            "</td>" +
            "<td>" +
            (r.maxUses === 0 ? "不限" : r.maxUses) +
            "</td>" +
            "<td>" +
            r.usedCount +
            "</td>" +
            "<td>" +
            statusBadge(r.status) +
            "</td>" +
            '<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' +
            (r.note || "") +
            '">' +
            (r.note || "—") +
            "</td>" +
            '<td class="tm">' +
            fmtTime(r.createdAt) +
            "</td>" +
            '<td class="tm">' +
            fmtTime(r.firstUsedAt) +
            "</td>" +
            '<td style="white-space:nowrap"></td>';
          var ops = tr.lastChild;
          var c = document.createElement("button");
          c.className = "mini ghost";
          c.textContent = "复制";
          c.onclick = function () {
            copy(r.code);
          };
          ops.appendChild(c);
          if (r.status !== "revoked" && r.status !== "exhausted") {
            var d = document.createElement("button");
            d.className = "mini danger";
            d.textContent = "作废";
            d.style.marginLeft = "6px";
            d.onclick = function () {
              if (!confirm("确定作废 " + r.code + " ？")) return;
              api("/api/admin/revoke", {
                method: "POST",
                body: JSON.stringify({ code: r.code }),
              })
                .then(function () {
                  toast("已作废");
                  refresh();
                })
                .catch(onErr);
            };
            ops.appendChild(d);
          }
          return tr;
        }

        // 按品类分组渲染
        function renderGroups() {
          var wrap = $("groups");
          wrap.innerHTML = "";
          $("empty").classList.toggle("hidden", rows.length > 0);

          var groups = {};
          rows.forEach(function (r) {
            var key = r.testId === "*" ? "__all" : r.testId;
            (groups[key] = groups[key] || []).push(r);
          });
          var keys = Object.keys(groups).sort(function (a, b) {
            if (a === "__all") return 1;
            if (b === "__all") return -1;
            return a < b ? -1 : 1;
          });

          var f = $("fTest").value;
          keys.forEach(function (key) {
            if (f && f !== key && !(f === "*" && key === "__all")) return;
            var g = groups[key];
            var t = tests.filter(function (x) {
              return x.id === key;
            })[0];
            var gname = key === "__all" ? "通用（任选测试）" : t ? t.name : key;
            var s = {
              total: g.length,
              unused: 0,
              active: 0,
              exhausted: 0,
              revoked: 0,
            };
            g.forEach(function (r) {
              s[r.status] = (s[r.status] || 0) + 1;
            });

            var sec = document.createElement("div");
            sec.className = "group";
            sec.innerHTML =
              '<h3><span class="gname">' +
              gname +
              "</span>" +
              '<span class="gsum">共 ' +
              s.total +
              " · 未使用 " +
              s.unused +
              " · 使用中 " +
              s.active +
              " · 已核销 " +
              s.exhausted +
              " · 已作废 " +
              s.revoked +
              "</span>" +
              '<span class="gsp"></span>' +
              '<button class="mini ghost jcopy">复制本组未使用</button></h3>' +
              '<div style="overflow-x:auto"><table><thead><tr>' +
              "<th>授权码</th><th>次数</th><th>已用</th><th>状态</th><th>备注</th><th>创建时间</th><th>首次使用</th><th>操作</th>" +
              "</tr></thead><tbody></tbody></table></div>";
            var tb = sec.querySelector("tbody");
            g.forEach(function (r) {
              tb.appendChild(rowEl(r));
            });
            var unused = g
              .filter(function (r) {
                return r.status === "unused";
              })
              .map(function (r) {
                return r.code;
              });
            sec.querySelector(".jcopy").onclick = function () {
              if (unused.length) copy(unused.join("\n"));
              else toast("本组没有未使用的码");
            };
            wrap.appendChild(sec);
          });

          var allUnused = rows
            .filter(function (r) {
              return r.status === "unused";
            })
            .map(function (r) {
              return r.code;
            });
          $("copyAll").classList.toggle("hidden", allUnused.length === 0);
          $("copyAll").onclick = function () {
            copy(allUnused.join("\n"));
          };
        }

        function refresh() {
          api("/api/admin/list")
            .then(function (d) {
              rows = d.rows || [];
              renderStats(d.stats);
              renderGroups();
            })
            .catch(onErr);
        }

        // 初始化 + 事件绑定
        boot();

        $("refresh").onclick = refresh;
        $("fTest").onchange = renderGroups;
        $("doLogin").onclick = doLogin;
        $("pwd").addEventListener("keydown", function (e) {
          if (e.key === "Enter") doLogin();
        });
        $("logout").onclick = function () {
          api("/api/admin/logout", { method: "POST" })
            .catch(function () {})
            .then(function () {
              showLogin("已退出登录");
            });
        };

        $("gen").onclick = function () {
          var body = {
            prefix: $("gPrefix").value.trim() || "TEST",
            count: parseInt($("gCount").value, 10) || 1,
            testId: $("gTest").value,
            maxUses:
              $("gUses").value === "0"
                ? 0
                : parseInt($("gUses").value, 10) || 1,
            note: $("gNote").value.trim(),
          };
          api("/api/admin/generate", {
            method: "POST",
            body: JSON.stringify(body),
          })
            .then(function (d) {
              var out = $("genOut");
              out.textContent = d.codes.join("\n");
              out.classList.remove("hidden");
              toast("已生成 " + d.codes.length + " 个");
              refresh();
            })
            .catch(onErr);
        };

        // 测试清单（优先取管理接口，能看到未上架的）
        function loadTestList() {
          return api("/api/admin/tests")
            .catch(function () {
              return fetch("/api/config").then(function (r) {
                return r.json();
              });
            })
            .then(function (d) {
              tests = (d && d.tests) || [];
              fillTestSelects();
            });
        }
      })();
    </script>
  </body>
</html>
